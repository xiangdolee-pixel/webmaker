<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자</title>
  <!-- 고객 사이트의 /admin/ 으로 열린다. css/ · js/ 는 엔진이 xim 의 같은 파일을 내준다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/admin/css/style.css">
  <script type="module" src="/admin/js/site-admin.js"></script>
</head>
<body>
  <main class="login" id="login" hidden>
    <form class="card login-card" id="login-form">
      <h1 data-site-name>관리자</h1>
      <p>홈페이지 관리자 로그인</p>
      <label class="field"><span>아이디</span>
        <input class="input" name="username" autocomplete="username" required>
      </label>
      <label class="field"><span>비밀번호</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary" type="submit">로그인</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="top">
      <span class="brand" data-site-name>관리자</span>
      <span class="who" id="who"></span>
      <a class="btn sm" href="/">홈페이지</a>
      <button class="btn sm" type="button" id="logout">로그아웃</button>
    </header>
    <main class="wrap">
      <section class="card item">
        <h2>수정 요청하기</h2>
        <form id="req-form">
          <label class="field"><span>제목</span><input class="input" name="title" maxlength="120" required placeholder="예) 메인 사진 교체 부탁드립니다"></label>
          <label class="field"><span>내용</span><textarea class="input" name="body" maxlength="5000" placeholder="바꾸고 싶은 곳과 내용을 적어 주세요."></textarea></label>
          <p class="err" id="req-err" role="alert"></p>
          <div class="actions"><button class="btn primary" type="submit">요청 보내기</button></div>
        </form>
      </section>
      <div class="bar section-gap"><h2>보낸 요청</h2></div>
      <div class="list" id="list"></div>
    </main>
  </div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>관리</title>
  <!-- 관리 화면은 사이트 파비콘 대신 xms 아이콘 (위쪽 막대 오른쪽 끝 밝은 보라) -->
  <link rel="icon" href="/xms/img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/xms/img/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/xms/img/icon-180.png">
  <!-- 고객 사이트의 /xms/ 로 열린다. css · js 는 /xms/ 아래에서 xms 가 내준다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/xms/css/style.css">
  <!-- 빨리 뜨게: js 를 받는 동안 로그인 정보 · 첫 화면(회원 목록) 자료를 미리 요청해 둔다 (admin.js 가 받아 쓴다) -->
  <script>
    (function () {
      var o = { credentials: 'same-origin' }, h = location.hash;
      window.__xmsPre = { '/me': fetch('/xms-api/admin/me', o) };
      if (!h || h === '#/' || h === '#/members') window.__xmsPre['/members?'] = fetch('/xms-api/admin/members?', o);
    })();
  </script>
  <script type="module" src="/xms/js/admin.js"></script>
  <!-- admin.js 가 부르는 모듈을 한꺼번에 미리 (차례로 받으면 왕복이 3번) -->
  <link rel="modulepreload" href="/xms/js/common.js">
  <link rel="modulepreload" href="/xms/js/editor.js">
  <link rel="modulepreload" href="/xms/js/blocks.js">
  <link rel="modulepreload" href="/xms/js/drag.js">
</head>
<body>
  <main class="pub-main" id="login" hidden>
    <section class="pub-box narrow">
      <h1 data-site-name>관리자 로그인</h1>
      <form id="login-form">
        <label class="field"><span>아이디</span><input class="input" name="login_id" autocomplete="username" required></label>
        <label class="field"><span>비밀번호</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
        <label class="check keep"><input type="checkbox" name="keep" checked> 로그인 유지</label>
        <p class="err" role="alert"></p>
        <button class="btn primary wide" type="submit">로그인</button>
      </form>
      <p class="sub-links"><span>관리자 등급 회원만 들어올 수 있습니다.</span><a href="/">홈페이지로</a></p>
    </section>
  </main>

  <div id="app" hidden>
    <header class="adm-top">
      <button class="menu-btn" type="button" aria-label="메뉴 열기" id="menu-btn"><span><i></i><i></i><i></i></span></button>
      <span class="logo">xms</span>
      <div class="top-act">
        <a class="top-btn" href="/" target="_blank" rel="noopener" title="홈페이지 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg><span>홈페이지 보기</span></a>
        <span class="who-chip"><i id="who-av" aria-hidden="true"></i><span id="who"></span></span>
        <button class="top-btn ghost" type="button" id="logout" title="로그아웃"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l4-4-4-4M14 12H4"/></svg><span>로그아웃</span></button>
      </div>
    </header>
    <div class="adm" id="adm">
      <nav class="side" id="side" aria-label="관리 메뉴"></nav>
      <div class="side-dim" id="side-dim"></div>
      <main class="main" id="main"></main>
    </div>
  </div>
</body>
</html>

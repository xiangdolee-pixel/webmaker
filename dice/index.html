<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주사위 Dice</title>
<meta name="description" content="주사위 개수를 고르고 화면을 누르면 주사위가 굴러가며 숫자가 나옵니다. 보드게임 · 윷놀이 대신 · 술자리 게임에 바로 쓰는 온라인 주사위.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css?v=3">
<script src="js/dice.js?v=3" defer></script>
</head>
<body>
<!-- 계정(로그인) 버튼 자리 — 화면 어디를 눌러도 던지는 도구라 숨김 (자리가 없으면 오른쪽 위에 떠서 나오므로 일부러 둔다) -->
<span class="xms-account" data-xms-account hidden></span>

<header class="top wrap">
  <h1 class="logo"><span class="logo-mark" aria-hidden="true"></span>주사위</h1>
  <div class="count" role="group" aria-label="주사위 개수">
    <span class="count-label">개수</span>
    <button type="button" class="step" data-step="-1" aria-label="주사위 하나 빼기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
    </button>
    <output class="count-num" id="count" aria-live="polite">2</output>
    <button type="button" class="step" data-step="1" aria-label="주사위 하나 더하기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg>
    </button>
  </div>
</header>

<main class="wrap play">
  <div class="skins-wrap">
    <div class="skins" id="skins" role="radiogroup" aria-label="주사위 종류"><span class="skin-ind" aria-hidden="true"></span></div>
  </div>
  <div class="board" id="board" data-dice="classic" role="button" tabindex="0" aria-label="눌러서 주사위 던지기">
    <div class="stage" id="stage"></div>
    <p class="hint" id="hint">화면을 눌러 던지세요</p>
  </div>

  <section class="result" aria-live="polite">
    <div class="total"><span class="total-label">합계</span><strong class="total-num" id="total">–</strong></div>
    <ol class="chips" id="chips"></ol>
  </section>
  <p class="history" id="history" aria-label="최근 기록"></p>
</main>
</body>
</html>
